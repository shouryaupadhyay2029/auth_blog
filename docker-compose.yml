version: '3.8'

services:
  db:
    image: mongo:6.0
    container_name: blogauth-db
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - blogauth-db-data:/data/db

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: blogauth-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGO_URI=mongodb://db:27017/blogAuth
      - JWT_SECRET=super-secret-production-key-change-this-for-safety
      - JWT_EXPIRES_IN=7d
    depends_on:
      - db

volumes:
  blogauth-db-data:

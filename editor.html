<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Editorial Studio — BlogAuth</title>
  <!-- Core Design Tokens & Resets -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/typography.css">
  <!-- Layout Grid & Primitives -->
  <link rel="stylesheet" href="css/layout.css">
  <!-- Component Stylesheets -->
  <link rel="stylesheet" href="css/navbar.css">
  <link rel="stylesheet" href="css/micro.css">
  <!-- Sprint 7: Editorial Studio Styles -->
  <link rel="stylesheet" href="css/editor.css">
  <link rel="stylesheet" href="css/state.css">
</head>
<body>
  <!-- Static Paper Grain Overlay Atmosphere -->
  <div class="paper-grain-overlay"></div>

  <!-- Fixed Floating Premium Navbar Header -->
  <header class="navbar-header">
    <div class="container navbar-container">
      <div class="navbar-surface">
        <div class="navbar-content" style="display: flex; width: 100%; justify-content: space-between; align-items: center; transform-origin: center center;">
          <!-- Left Section: Logo & Desktop Links -->
          <div class="navbar-left">
            <a href="index.html" class="logo" aria-label="BlogAuth homepage">
              <span class="logo-mark">▲</span>
              <span class="logo-text">BLOGAUTH</span>
            </a>
            <nav class="nav-desktop" aria-label="Main Navigation">
              <ul class="nav-links">
                <li><a href="index.html" data-tooltip="Home"><span class="nav-text">Home</span></a></li>
                <li><a href="article.html" data-tooltip="Articles"><span class="nav-text">Articles</span></a></li>
                <li><a href="categories.html" data-tooltip="Categories"><span class="nav-text">Categories</span></a></li>
                <li><a href="about.html" data-tooltip="About"><span class="nav-text">About</span></a></li>
              </ul>
            </nav>
          </div>

          <!-- Right Section: Actions -->
          <div class="navbar-right">
            <div class="user-actions">
              <a href="dashboard.html" class="btn btn-ghost" style="padding:var(--spacing-8) var(--spacing-16); font-weight:600;">Dashboard</a>
              <a href="dashboard.html" class="author-avatar" style="text-decoration:none; margin-right:var(--spacing-8);">▲</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- Primary Workspace Content Container -->
  <main class="editor-page">
    <div class="editor-workspace">
      
      <!-- LEFT COLUMN: Canvas -->
      <section class="editor-canvas">
        <!-- Markdown formatting helper bar -->
        <div class="editor-toolbar">
          <button class="toolbar-btn" type="button" onclick="insertMarkdown('**', '**')">B</button>
          <button class="toolbar-btn" type="button" onclick="insertMarkdown('*', '*')">I</button>
          <button class="toolbar-btn" type="button" onclick="insertMarkdown('`', '`')">Code</button>
          <button class="toolbar-btn" type="button" onclick="insertMarkdown('> ', '')">Quote</button>
          <button class="toolbar-btn" type="button" onclick="insertMarkdown('- ', '')">List</button>
          <button class="toolbar-btn" type="button" onclick="insertMarkdown('| Header | Header |\n|------|------|\n| Cell | Cell |', '')">Table</button>
          <button class="toolbar-btn" type="button" onclick="insertMarkdown('[Link Text](url)', '')">Link</button>
          <button class="toolbar-btn" type="button" onclick="document.getElementById('inline-file-input').click()">+ Image</button>
          <input type="file" id="inline-file-input" style="display:none;" accept="image/*">
        </div>

        <!-- Cover Image Preview/Drop -->
        <div class="cover-preview-wrapper" id="cover-dropzone">
          <img id="cover-image-img" src="" style="display:none;" alt="Cover image preview">
          <div id="cover-placeholder" style="text-align:center;">
            <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" fill="none" stroke="var(--text-secondary)" stroke-width="1.5" viewBox="0 0 24 24">
              <rect width="18" height="18" x="3" y="3" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/>
            </svg>
            <p style="font-size:0.75rem; color:var(--text-secondary); margin-top:8px;">Drag cover image here or click to upload</p>
          </div>
          <input type="file" id="cover-file-input" style="display:none;" accept="image/*">
          <div class="cover-actions">
            <button class="btn btn-secondary btn-sm" id="btn-upload-cover" type="button">Upload</button>
            <button class="btn btn-secondary btn-sm" id="btn-remove-cover" type="button" style="display:none; background-color:#ef4444; border-color:#ef4444; color:white;">Remove</button>
          </div>
        </div>

        <!-- Title -->
        <textarea class="title-textarea" id="editor-title" placeholder="Untitled Article" rows="1"></textarea>

        <!-- Subtitle -->
        <textarea class="subtitle-textarea" id="editor-subtitle" placeholder="Add a subtitle..." rows="1"></textarea>

        <!-- Main Body Text Area -->
        <textarea class="content-textarea" id="editor-content" placeholder="Start writing your thoughts... (Supports Markdown / HTML content)"></textarea>
      </section>

      <!-- RIGHT SIDEBAR: Settings & Workflows -->
      <aside class="editor-sidebar" aria-label="Editor Settings Sidebar">
        
        <!-- Action Cards -->
        <div class="sidebar-card">
          <h4 class="sidebar-card-title">Publishing Workspace</h4>
          
          <div class="save-status-bar">
            <span class="status-dot" id="save-indicator"></span>
            <span id="save-status-text">Draft saved successfully.</span>
          </div>

          <div style="display:grid; grid-template-columns: 1fr 1fr; gap:var(--spacing-8); margin-bottom:var(--spacing-16);">
            <button class="btn btn-primary btn-sm" id="btn-manual-save" type="button" style="grid-column: span 2;">Save Now</button>
            <button class="btn btn-secondary btn-sm" id="btn-preview-draft" type="button">Preview</button>
            <button class="btn btn-secondary btn-sm" id="btn-duplicate-draft" type="button">Duplicate</button>
            <button class="btn btn-secondary btn-sm" id="btn-archive-draft" type="button">Archive</button>
            <button class="btn btn-secondary btn-sm" id="btn-delete-draft" type="button" style="color:#ef4444; border-color:rgba(239,68,68,0.2);">Delete</button>
          </div>

          <div class="seo-form-group">
            <label for="publish-status">Article Stage</label>
            <select class="seo-form-select" id="publish-status" disabled>
              <option value="draft">Draft</option>
              <option value="in review">In Review</option>
              <option value="scheduled">Scheduled</option>
              <option value="published">Published</option>
              <option value="archived">Archived</option>
              <option value="rejected">Rejected</option>
            </select>
          </div>

          <!-- Workflow transition buttons -->
          <div style="display:flex; flex-direction:column; gap:var(--spacing-8); margin-top:var(--spacing-12);">
            <button class="btn btn-primary btn-sm" id="btn-submit-review" type="button" style="background-color:#3b82f6; border-color:#3b82f6;">Submit for Review</button>
            <button class="btn btn-primary btn-sm" id="btn-publish-immediately" type="button">Publish Immediately</button>
          </div>
        </div>

        <!-- Scheduling Publication -->
        <div class="sidebar-card">
          <h4 class="sidebar-card-title">Scheduling</h4>
          <div class="seo-form-group">
            <label for="schedule-date">Schedule Publication Date</label>
            <input type="datetime-local" class="seo-form-input" id="schedule-date">
          </div>
          <div class="seo-form-group">
            <label for="schedule-timezone">Timezone</label>
            <select class="seo-form-select" id="schedule-timezone">
              <option value="UTC">UTC</option>
              <option value="America/New_York">EST / New York</option>
              <option value="Europe/London">GMT / London</option>
              <option value="Asia/Kolkata">IST / India</option>
              <option value="Asia/Tokyo">JST / Tokyo</option>
            </select>
          </div>
          <button class="btn btn-secondary btn-sm w-full" id="btn-schedule-post" type="button" style="margin-top:var(--spacing-8);">Apply Schedule</button>
        </div>

        <!-- Taxonomy Config Card -->
        <div class="sidebar-card">
          <h4 class="sidebar-card-title">Taxonomy Settings</h4>
          
          <div class="seo-form-group">
            <label for="article-category">Category</label>
            <select class="seo-form-select" id="article-category">
              <option value="">-- Choose Category --</option>
              <!-- Populated dynamically -->
            </select>
          </div>

          <div class="seo-form-group">
            <label>Tags</label>
            <div class="tags-input-container" id="tags-wrapper">
              <!-- Dynamically populated tag pills -->
              <input type="text" class="tags-text-input" id="tags-search" placeholder="Type tag name..." autocomplete="off">
            </div>
            <!-- Suggestions Dropdown -->
            <div class="tag-suggestions" id="tags-suggestions-box" style="display:none;"></div>
          </div>
        </div>

        <!-- SEO Configurations -->
        <div class="sidebar-card">
          <h4 class="sidebar-card-title">SEO Configurations</h4>
          <div class="seo-form-group">
            <label for="seo-title">SEO Custom Title</label>
            <input type="text" class="seo-form-input" id="seo-title" placeholder="SEO Title">
          </div>
          <div class="seo-form-group">
            <label for="seo-description">SEO Description</label>
            <input type="text" class="seo-form-input" id="seo-description" placeholder="SEO Meta Description">
          </div>
          <div class="seo-form-group">
            <label for="seo-keywords">Meta Keywords (Comma separated)</label>
            <input type="text" class="seo-form-input" id="seo-keywords" placeholder="rust, state-management, dev">
          </div>
          <div class="seo-form-group">
            <label for="seo-canonical">Canonical URLOverride</label>
            <input type="text" class="seo-form-input" id="seo-canonical" placeholder="https://domain.com/original-url">
          </div>
        </div>

        <!-- Revision History List -->
        <div class="sidebar-card">
          <h4 class="sidebar-card-title">Revision History</h4>
          <div class="revision-list" id="revision-container">
            <!-- Versions fetched dynamically -->
            <span style="font-size:0.75rem; color:var(--text-secondary);">No revision saves logged.</span>
          </div>
        </div>

      </aside>

    </div>
  </main>

  <!-- Script loads -->
  <script src="js/micro.js"></script>
  <!-- GSAP CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="js/navbar.js"></script>
  <!-- API & Auth System -->
  <script src="js/storage.js"></script>
  <script src="js/request.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth-service.js"></script>
  <!-- Sprint 7: Editorial Studio Script -->
  <script src="js/editor.js"></script>
  <!-- Sprint 12: Application State Script -->
  <script src="js/state.js"></script>

  <script>
    // Textarea markdown inserts helper
    function insertMarkdown(prefix, suffix) {
      const textarea = document.getElementById('editor-content');
      const start = textarea.selectionStart;
      const end = textarea.selectionEnd;
      const text = textarea.value;
      const selectedText = text.substring(start, end);
      const replacement = prefix + selectedText + suffix;
      
      textarea.value = text.substring(0, start) + replacement + text.substring(end);
      textarea.focus();
      textarea.selectionStart = start + prefix.length;
      textarea.selectionEnd = start + prefix.length + selectedText.length;
      
      // Trigger input event
      textarea.dispatchEvent(new Event('input', { bubbles: true }));
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — BlogAuth</title>
  <!-- Core Design Tokens & Resets -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/typography.css">
  <!-- Layout Grid & Primitives -->
  <link rel="stylesheet" href="css/layout.css">
  <!-- Component Stylesheets -->
  <link rel="stylesheet" href="css/navbar.css">
  <!-- Sprint 8: Premium Micro Experience System -->
  <link rel="stylesheet" href="css/micro.css">
  <!-- Sprint 9: Architectural Interactive Editorial Cards -->
  <link rel="stylesheet" href="css/cards.css">
  <!-- Sprint 8: Authentication Experience Styles -->
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>
  <!-- Static Paper Grain Overlay Atmosphere -->
  <div class="paper-grain-overlay"></div>

  <main class="auth-page">
    
    <!-- LEFT PANEL: Brand Statement (Desktop Only) -->
    <section class="auth-brand-panel" aria-label="Brand Information">
      <div class="auth-brand-top auth-reveal" data-auth-delay="0">
        <a href="index.html" class="auth-brand-logo">▲ BLOGAUTH</a>
      </div>
      
      <div class="auth-brand-middle">
        <div class="auth-brand-rule auth-reveal" data-auth-delay="80"></div>
        <h2 class="auth-brand-title auth-reveal" data-auth-delay="160">Enter the workspace.</h2>
        <div class="auth-brand-quote auth-reveal" data-auth-delay="240">
          <p id="auth-quote-text">“Write. Publish. Inspire. Clear design enables clear thinking.”</p>
          <span id="auth-quote-author" style="display:block; font-size:0.75rem; font-style:normal; margin-top:var(--spacing-8); font-weight:700; letter-spacing:0.08em; text-transform:uppercase;">ARCHIVE JOURNAL</span>
        </div>
      </div>
      
      <div class="auth-brand-footer auth-reveal" data-auth-delay="320">
        <span>© 2026 ARCHIVE V1. All rights reserved.</span>
      </div>
    </section>

    <!-- RIGHT PANEL: Authentication Form -->
    <section class="auth-form-panel" aria-label="Login Form">
      <div class="featured-small-card auth-card auth-reveal" data-auth-delay="160">
        
        <header class="auth-card-header">
          <h1 class="auth-card-title">Sign In</h1>
          <p class="auth-card-subtitle">
            Or <a href="register.html">create a new workspace account</a>
          </p>
        </header>

        <form action="#" method="POST" class="form-group-container">
          
          <!-- Email field -->
          <div class="form-group">
            <label for="email" class="form-label">Email Address</label>
            <div class="form-input-wrapper">
              <input type="email" id="email" name="email" class="form-input" required autocomplete="email">
              <div class="form-input-border"></div>
            </div>
            <!-- Validation slot -->
            <div class="form-validation-msg" id="validation-email"></div>
          </div>

          <!-- Password field -->
          <div class="form-group">
            <label for="password" class="form-label">Password</label>
            <div class="form-input-wrapper">
              <input type="password" id="password" name="password" class="form-input" required autocomplete="current-password">
              <div class="form-input-border"></div>
            </div>
            <!-- Validation slot -->
            <div class="form-validation-msg" id="validation-password"></div>
          </div>

          <!-- Utilities Row -->
          <div class="form-options-row">
            <label class="checkbox-label">
              <input type="checkbox" name="remember" class="checkbox-input">
              <span>Remember me</span>
            </label>
            <a href="forgot-password.html" class="forgot-pass-link">Forgot password?</a>
          </div>

          <!-- Sign In Actions -->
          <div style="margin-top:var(--spacing-8); display:flex; flex-direction:column; gap:var(--spacing-16);">
            <button class="btn btn-primary w-full" type="submit" style="justify-content:center;">
              Sign In <span>→</span>
            </button>
            
            <div class="auth-separator">
              <span class="auth-separator-text">or continue with</span>
            </div>

            <button class="btn-social" type="button">
              <span class="social-logo-mark">▲</span>
              <span>Google Account</span>
            </button>
          </div>

        </form>

      </div>
    </section>

  </main>

  <!-- Script loads -->
  <script src="js/micro.js"></script>
  <script src="js/cards.js"></script>
  <!-- API & Auth System -->
  <script src="js/storage.js"></script>
  <script src="js/request.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth-service.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
